name: Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: cp-microservice

jobs:
  test_build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: ./mvnw -B test

      - name: Generate image tags
        run: |
          echo "VERSION=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Check Docker Hub configuration
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          test -n "$DOCKER_USER" || { echo '::error::Configure a variavel DOCKER_USER.'; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo '::error::Configure o secret DOCKER_TOKEN.'; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
